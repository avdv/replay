name: update-flake-lock
on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: '0 0 * * 0' # runs weekly on Sunday at 00:00

jobs:
  lockfile:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Set author identity
        run: |
          git config user.email '${{ github.actor }}@users.noreply.github.com'
          git config user.name '${{ github.actor }}'
      - run: nix flake update --commit-lock-file
      - name: Update fixed output hash
        run: .github/update-hash replay.deps
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "Update `fetchAttrs.sha256` hash"
          title: "Update flake.lock"
          branch: "automation/update-flake-inputs"
          labels: "dependencies"
          token: "${{ secrets.PR_TOKEN }}"

